name: 'Pack npm Package'

on:
  workflow_call:
    inputs:
      version:
        description: 'Package version to stamp onto the build'
        required: true
        type: string
      ref:
        description: 'Git ref (branch name) to check out before building'
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-pack:
    name: 'Pack'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Package tagged source
        uses: cake-build/cake-action@d218f1133bb74a1df0b08c89cfd8fc100c09e1a0 #v3.0.1
        env:
          ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
          PACKAGE_VERSION: ${{ inputs.version }}
          OUTPUT_DIR: artifacts
        with:
          script-path: ./build.cake
          target: PackOnly

      - name: Verify package version
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          mapfile -t packages < <(find artifacts -maxdepth 1 -type f -name '*.tgz')
          if [[ ${#packages[@]} -ne 1 ]]; then
            echo "Expected exactly one npm package, found ${#packages[@]}." >&2
            exit 1
          fi

          packaged_version=$(tar -xOf "${packages[0]}" package/package.json | jq -r '.version')
          if [[ "$packaged_version" != "$EXPECTED_VERSION" ]]; then
            echo "Package version '$packaged_version' does not match tag '$EXPECTED_VERSION'." >&2
            exit 1
          fi

      - name: Upload npm package artifact
        uses: actions/upload-artifact@v4
        with:
          name: npm-packages
          path: artifacts/*.tgz
          if-no-files-found: error
