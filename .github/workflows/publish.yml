name: 'Publish npm Package'

on:
  push:
    tags:
      - '*.*.*'

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: 'Publish'
    uses: DEFRA/lis-github-actions/.github/workflows/npm-package-publish.yml@0.7.2
    secrets: inherit
